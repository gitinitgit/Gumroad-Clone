# ==============================================================================
# Production Nginx Configuration — Gumroad Clone
#
# Supports TWO deployment architectures:
#   MODE 1 (Default): Cloud PaaS / Render / Load Balancer (Edge SSL Termination)
#   MODE 2: Standalone VPS / Dedicated Server (Direct Let's Encrypt SSL)
# ==============================================================================

# ─── Upstream Servers ─────────────────────────────────────────────────────────
upstream backend_api {
    # Set to your server host:port (127.0.0.1:5000 in Docker Compose or local PM2)
    server 127.0.0.1:5000;
    keepalive 64;
}

upstream frontend_client {
    # Set to your client host:port (127.0.0.1:5173 or internal container service)
    server 127.0.0.1:5173;
    keepalive 64;
}

# ─── Rate Limiting Zones ──────────────────────────────────────────────────────
# Use $http_x_forwarded_for when behind a proxy / Render, or $binary_remote_addr directly
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_checkout:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Map for WebSocket Upgrade header handling
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# MODE 1: Cloud PaaS / Render / AWS ALB / Heroku (Edge SSL Termination)
# SSL is managed automatically by Render / Cloudflare / Cloud Provider at the edge.
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Trust X-Forwarded-For headers from load balancer / proxy
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── DDoS & Resource Protection ──
    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 65s;
    limit_conn conn_limit 100;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── API Routes → Express Backend ──
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Timeouts
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    # ── Auth Routes (Strict Rate Limiting) ──
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Checkout Routes ──
    location /api/v1/checkout/ {
        limit_req zone=api_checkout burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Payment Webhooks (No rate limiting, raw payload preservation) ──
    location /api/v1/webhooks/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering on;
    }

    # ── Backend Health Check ──
    location /health {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── React Client (SPA) ──
    location / {
        proxy_pass http://frontend_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Block Malicious Scanning ──
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* (\.php|\.asp|\.aspx|\.jsp|\.env|\.git|\.bak|\.config)$ {
        deny all;
        return 404;
    }
}

